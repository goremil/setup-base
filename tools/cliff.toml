# git-cliff configuration for every repository on setup-base that tags releases
# (R-git-08): one section per release tag, built from the Conventional Commit
# subjects (commit-msg-check). Plain Markdown for the forge lint profile: no
# emoji, no reference links. The group names carry a sort key in an HTML
# comment, which the template strips.

[changelog]
header = """
# Changelog

Generated by git-cliff from the Conventional Commit subjects, one section per release tag. Maintenance commits (`chore`, `ci`, `build`, `style`, `test`) are left out."""
body = """

{% if version -%}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}`{{ commit.scope }}`: {% endif %}{% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message }}
{%- endfor %}
{% endfor -%}"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^revert", group = "<!-- 5 -->Reverts" },
  { message = ".*", skip = true },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"

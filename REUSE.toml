version = 1
SPDX-PackageName = "setup-base"
SPDX-PackageDownloadLocation = "https://github.com/goremil/setup-base"

# Documentation and rules: CC-BY-4.0.
[[annotations]]
path = ["**.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 setup-base contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Code, build definitions and configuration: MIT.
[[annotations]]
path = [
  "flake.nix",
  "flake.lock",
  "REUSE.toml",
  ".editorconfig",
  ".gitignore",
  ".forgejo/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 setup-base contributors"
SPDX-License-Identifier = "MIT"

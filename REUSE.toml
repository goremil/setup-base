version = 1
SPDX-PackageName = "setup-base"
SPDX-PackageDownloadLocation = "https://github.com/goremil/setup-base"

# Documentation and rules: CC-BY-SA-4.0.
[[annotations]]
path = ["**.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 setup-base contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Code, build definitions and configuration: GPL-3.0-only.
[[annotations]]
path = [
  "flake.nix",
  "copier.yml",
  "lib/**",
  "markdownlint/**",
  "tools/**",
  "tests/**",
  "flake.lock",
  "REUSE.toml",
  ".editorconfig",
  ".gitignore",
  ".forgejo/**",
  "cspell.config.yaml",
  ".cspell/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 setup-base contributors"
SPDX-License-Identifier = "GPL-3.0-only"

# The template: its files are copied into other repositories, so 0BSD, which
# asks nothing of a copy. The licence texts it ships are included from
# LICENSES/ at copy time, not stored here.
[[annotations]]
path = ["template/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 setup-base contributors"
SPDX-License-Identifier = "0BSD"

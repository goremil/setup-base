# Runs repo-check -v (every check, `nix flake check` included) in the dev shell
# on every push and pull request (R-check-03, R-check-11).
#
# Codeberg's shared runners use their own labels (codeberg-tiny/-small/-medium,
# https://codeberg.org/actions/meta), not `ubuntu-latest`. Nix is installed by
# the Determinate installer's script with `--init none`, since the runner is a
# container without systemd; a bare `owner/repo@ref` action would resolve
# against Codeberg's mirror at data.forgejo.org, which lacks the Nix actions.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-check:
    runs-on: codeberg-small
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Install Nix
        run: |
          curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix \
            | sh -s -- install linux --extra-conf "sandbox = false" --init none --no-confirm
          echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"

      - name: repo-check
        run: nix develop --command repo-check -v

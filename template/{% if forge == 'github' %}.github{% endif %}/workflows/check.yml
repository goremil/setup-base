# Runs repo-check -v (every check, `nix flake check` included) in the dev shell
# on every push to main and every pull request (R-check-03, R-check-11).
name: check

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; actions pinned by commit, the tag as a comment (zizmor).
permissions:
  contents: read

jobs:
  repo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: repo-check
        run: nix develop --command repo-check -v
